name: 缺陷报告
description: 守护进程、挂盘、托盘或界面出了问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量附上日志（设置页 → 打开日志目录）。日志在 `%APPDATA%\lea\wsl-keeper\logs`。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为，以及你期望的行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择发行版 Ubuntu
        2. 打开自动挂载
        3. 重启 Windows
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - WSL 保活
        - 物理磁盘挂载
        - 托盘 / 开机启动
        - 设置与配置
        - 界面
        - 安装 / 更新
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2
  - type: input
    id: wsl
    attributes:
      label: WSL / 发行版
      placeholder: WSL 2.4.x，Ubuntu 22.04
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 可粘贴 `wsl-keeper.*.log` 或 `mount_task.log` 中的片段。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前
      options:
        - label: 已在 Issues 里搜索过类似问题
          required: true
        - label: 问题在最新 Release 或当前 main 上仍能复现
          required: true
