name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    name: Build and publish Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: tauri-build

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action replaces __VERSION__ from tauri.conf.json / package.json,
      # not from the git tag. Fail early if they drifted.
      - name: Verify versions match git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "tag=$tag  package.json=$pkg  Cargo.toml=$cargo"
          if ($tag -ne $pkg) {
            Write-Error "package.json ($pkg) does not match git tag ($tag). tauri-action attaches to v$pkg, not the pushed tag."
            exit 1
          }
          if ($tag -ne $cargo) {
            Write-Error "src-tauri/Cargo.toml ($cargo) does not match git tag ($tag)."
            exit 1
          }

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: WSL Keeper v__VERSION__
          releaseBody: |
            Windows 托盘应用：保持 WSL 发行版在线，并在重启后重新挂载 Linux 物理磁盘。

            安装包：
            - `.msi` — 适合通过 Windows Installer 安装
            - `-setup.exe` — NSIS 安装包，一般直接下载这个即可
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
