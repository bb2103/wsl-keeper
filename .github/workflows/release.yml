name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    name: Build and publish Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: tauri-build

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: WSL Keeper v__VERSION__
          releaseBody: |
            Windows 托盘应用：保持 WSL 发行版在线，并在重启后重新挂载 Linux 物理磁盘。

            安装包：
            - `.msi` — 适合通过 Windows Installer 安装
            - `-setup.exe` — NSIS 安装包，一般直接下载这个即可
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
